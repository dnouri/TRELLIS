[pytest]
testpaths = trellis_modal/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Register custom markers
markers =
    integration: Integration tests that require a deployed Modal service (GPU)
    slow: Tests that take more than 5 seconds to run

# Default options: run all tests except integration tests
addopts = -m "not integration" --tb=short

# Ignore specific directories
norecursedirs = .venv .git __pycache__ tmp
